<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Document Intake Assistant</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>Document Intake Assistant</h1>
      <span class="pill pill-warn">Fictional · not legal advice</span>
    </div>
    <div class="topbar-actions">
      <span id="llm-status" class="llm-status">Checking model…</span>
      <button id="new-session" class="btn btn-ghost" type="button">Start over</button>
    </div>
  </header>

  <div id="banner" class="banner" hidden></div>

  <main class="layout">
    <section class="panel chat" aria-label="Conversation">
      <div id="messages" class="messages" aria-live="polite"></div>
      <form id="composer" class="composer">
        <textarea id="input" rows="2" maxlength="2000" placeholder="Type your answer… (Enter to send, Shift+Enter for a new line)" required></textarea>
        <button id="send" class="btn btn-primary" type="submit">Send</button>
      </form>
    </section>

    <section class="panel preview" aria-label="Live preview">
      <div class="card">
        <div class="card-head">
          <h2>Collected information</h2>
          <div class="segmented" role="tablist">
            <button type="button" class="seg active" data-view="fields" role="tab">Fields</button>
            <button type="button" class="seg" data-view="json" role="tab">JSON</button>
          </div>
        </div>
        <div class="progress"><div id="progress-bar" class="progress-bar"></div></div>
        <p id="progress-text" class="muted small"></p>
        <ul id="fields" class="fields"></ul>
        <pre id="json" class="json" hidden></pre>
      </div>

      <div class="card">
        <div class="card-head">
          <h2>Draft document</h2>
          <button id="download" class="btn btn-ghost btn-sm" type="button">Download .md</button>
        </div>
        <article id="document" class="document"></article>
      </div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
